<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Checking your deal… | Strikethrough</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0c;color:#f5f5f7;font:16px/1.5 system-ui,sans-serif}</style></head>
<body><p>Checking your deal…</p>
<script>
// Receives a product shared from another app (title/text/url) and hands it to the Check a deal box.
(function () {
  var p = new URLSearchParams(location.search);
  var url = p.get('url') || '', text = p.get('text') || '', title = p.get('title') || '';
  var found = (text.match(/https?:\/\/\S+/) || [])[0] || '';
  var q = url || found || text || title;
  location.replace('/?check=' + encodeURIComponent(q.slice(0, 500)) + '&src=share#check');
})();
</script></body></html>
